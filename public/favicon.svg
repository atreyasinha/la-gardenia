<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#7a5a06" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="240" fill="#faf7f2" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner Gold Emblem Shield -->
  <circle cx="256" cy="256" r="210" fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Inner Delicate Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.45" stroke-dasharray="6 4" />

  <!-- Soaring Bird of Freedom Vector Silhouette -->
  <g fill="#ffffff" filter="url(#goldGlow)">
    <!-- Main Bird Body, Wings & Tail Vector Path -->
    <path d="
      M 256 140
      C 270 180 300 210 385 180
      C 415 170 440 155 450 145
      C 435 175 400 215 350 240
      C 320 255 295 260 280 270
      C 290 310 305 345 315 375
      C 290 365 270 345 256 325
      C 242 345 222 365 197 375
      C 207 345 222 310 232 270
      C 217 260 192 255 162 240
      C 112 215 77 175 62 145
      C 72 155 97 170 127 180
      C 212 210 242 180 256 140 Z
    " />
    
    <!-- Bird Head and Beak Detail -->
    <path d="
      M 256 140
      C 258 130 263 125 268 122
      C 272 120 278 122 284 126
      C 275 132 267 138 256 140 Z
    " />
  </g>
</svg>
