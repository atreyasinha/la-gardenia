<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#7a5a06" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#b8860b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="240" fill="#faf7f2" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner Gold Circle Shield -->
  <circle cx="256" cy="256" r="210" fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Decorative Inner Gold Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Botanical Leaf Wreath Motif -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Left Leaf Arc -->
    <path d="M 120 256 C 120 180 180 120 256 120 C 240 145 230 180 240 210 C 190 200 140 220 120 256 Z" />
    <!-- Right Leaf Arc -->
    <path d="M 392 256 C 392 180 332 120 256 120 C 272 145 282 180 272 210 C 322 200 372 220 392 256 Z" />
  </g>

  <!-- Elegant Monogram Letter "G" -->
  <text
    x="256"
    y="315"
    font-family="'Cormorant Garamond', 'Georgia', serif"
    font-size="220"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-2"
    style="filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.25));"
  >
    G
  </text>
</svg>
